<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="padding:0;">
  <header style="display:flex; align-items:center; justify-content:space-between; padding:20px 32px; background:var(--bone); border-bottom:1px solid var(--rule);">
    <img src="../assets/logo.svg" style="height:36px;">
    <nav style="display:flex; gap:32px; font-family:var(--font-body); font-size:13px; font-weight:500; color:var(--ink);">
      <span>Kolekcije</span>
      <span>Radionica</span>
      <span style="color:var(--walnut); border-bottom:1px solid var(--walnut); padding-bottom:2px;">Projekti</span>
      <span>Dnevnik</span>
      <span>Kontakt</span>
    </nav>
    <div style="display:flex; gap:18px; align-items:center; font-family:var(--font-body); font-size:13px; color:var(--ink);">
      <span style="font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:var(--stone);">HR · EN</span>
      <span style="display:inline-flex; align-items:center; gap:8px; padding:8px 14px; border:1px solid var(--ink); border-radius:2px; font-size:12px; font-weight:500;">Konzultacija</span>
    </div>
  </header>
  <div style="padding:14px 32px; font-family:var(--font-body); font-size:11px; color:var(--stone); letter-spacing:0.06em;">Sticky header — fully opaque at rest, backdrop-blur(16) over bone/86% when scrolled over image.</div>
</body></html>
