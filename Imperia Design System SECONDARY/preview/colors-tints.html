<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
  <div class="card-eyebrow">Ink & Bone — tints</div>
  <div style="display:flex; flex-direction:column; gap:14px;">
    <div>
      <div style="font-family:var(--font-body); font-size:11px; color:var(--stone); margin-bottom:6px;">Ink (text + dark surfaces)</div>
      <div style="display:flex; gap:6px;">
        <div style="flex:1; height:44px; background:#1A1916;"></div>
        <div style="flex:1; height:44px; background:#2C2A26;"></div>
        <div style="flex:1; height:44px; background:#4A4741;"></div>
        <div style="flex:1; height:44px; background:#6E6A62;"></div>
        <div style="flex:1; height:44px; background:#8B847A;"></div>
      </div>
      <div style="display:flex; gap:6px; margin-top:4px; font-family:var(--font-body); font-size:10px; color:var(--stone);">
        <div style="flex:1;">1A1916</div><div style="flex:1;">2C2A26</div><div style="flex:1;">4A4741</div><div style="flex:1;">6E6A62</div><div style="flex:1;">8B847A</div>
      </div>
    </div>
    <div>
      <div style="font-family:var(--font-body); font-size:11px; color:var(--stone); margin-bottom:6px;">Bone (backgrounds + light surfaces)</div>
      <div style="display:flex; gap:6px;">
        <div style="flex:1; height:44px; background:#FAF7F1; border:1px solid var(--rule);"></div>
        <div style="flex:1; height:44px; background:#F4EFE7; border:1px solid var(--rule);"></div>
        <div style="flex:1; height:44px; background:#ECE5D9; border:1px solid var(--rule);"></div>
        <div style="flex:1; height:44px; background:#E0D7C7; border:1px solid var(--rule);"></div>
        <div style="flex:1; height:44px; background:#D2C7B3; border:1px solid var(--rule);"></div>
      </div>
      <div style="display:flex; gap:6px; margin-top:4px; font-family:var(--font-body); font-size:10px; color:var(--stone);">
        <div style="flex:1;">FAF7F1</div><div style="flex:1;">F4EFE7</div><div style="flex:1;">ECE5D9</div><div style="flex:1;">E0D7C7</div><div style="flex:1;">D2C7B3</div>
      </div>
    </div>
  </div>
</body></html>
