<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
  <div class="card-eyebrow">Form inputs</div>
  <div style="display:grid; grid-template-columns: 1fr 1fr; gap:18px;">
    <div>
      <label style="font-family:var(--font-body); font-size:11px; font-weight:500; letter-spacing:0.14em; text-transform:uppercase; color:var(--ink-70); display:block; margin-bottom:8px;">Ime</label>
      <input type="text" value="Ana Horvat" style="font-family:var(--font-body); font-size:15px; color:var(--ink); width:100%; padding:12px 0; background:transparent; border:none; border-bottom:1px solid var(--ink); outline:none; box-sizing:border-box;">
    </div>
    <div>
      <label style="font-family:var(--font-body); font-size:11px; font-weight:500; letter-spacing:0.14em; text-transform:uppercase; color:var(--ink-70); display:block; margin-bottom:8px;">Telefon</label>
      <input type="text" placeholder="+385 ..." style="font-family:var(--font-body); font-size:15px; color:var(--stone); width:100%; padding:12px 0; background:transparent; border:none; border-bottom:1px solid var(--rule-strong); outline:none; box-sizing:border-box;">
    </div>
    <div style="grid-column: 1 / -1;">
      <label style="font-family:var(--font-body); font-size:11px; font-weight:500; letter-spacing:0.14em; text-transform:uppercase; color:var(--ink-70); display:block; margin-bottom:8px;">Poruka</label>
      <textarea rows="2" style="font-family:var(--font-body); font-size:15px; color:var(--ink); width:100%; padding:12px 0; background:transparent; border:none; border-bottom:1px solid var(--rule-strong); outline:none; resize:none; box-sizing:border-box;">Renoviramo stan na Tuškancu — voljeli bismo dogovoriti razgovor.</textarea>
    </div>
  </div>
</body></html>
