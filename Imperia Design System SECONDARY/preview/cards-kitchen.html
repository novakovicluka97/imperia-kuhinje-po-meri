<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
  <div class="card-eyebrow">Kitchen card · default tile</div>
  <div style="display:grid; grid-template-columns: 1fr 1fr; gap:24px;">
    <div>
      <div style="aspect-ratio: 4/3; background: linear-gradient(135deg, #3a2e22 0%, #1a1916 60%, #6b4a2b 140%); position:relative;">
        <div style="position:absolute; inset:0; background:
          repeating-linear-gradient(90deg, rgba(244,239,231,0.04) 0 1px, transparent 1px 28%),
          linear-gradient(180deg, transparent 60%, rgba(0,0,0,0.3) 100%);"></div>
      </div>
      <div style="border-top:1px solid var(--rule); padding-top:12px; margin-top:14px; display:flex; justify-content:space-between; align-items:flex-end;">
        <div>
          <div style="font-family:var(--font-display); font-size:22px; line-height:1.1;">Tuškanac III</div>
          <div style="font-family:var(--font-body); font-size:13px; color:var(--stone); margin-top:4px;">Walnut, hand-rubbed lacquer · Zagreb</div>
        </div>
        <div style="font-family:var(--font-body); font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:var(--walnut);">2024</div>
      </div>
    </div>
    <div>
      <div style="aspect-ratio: 4/3; background: linear-gradient(180deg, #ECE5D9 0%, #D2C7B3 100%); position:relative;">
        <div style="position:absolute; inset:0;
          background:
            linear-gradient(90deg, transparent 50%, rgba(107,74,43,0.10) 50%),
            linear-gradient(180deg, transparent 70%, rgba(26,25,22,0.10) 100%);"></div>
      </div>
      <div style="border-top:1px solid var(--rule); padding-top:12px; margin-top:14px; display:flex; justify-content:space-between; align-items:flex-end;">
        <div>
          <div style="font-family:var(--font-display); font-size:22px; line-height:1.1;">Šestine Pantry</div>
          <div style="font-family:var(--font-body); font-size:13px; color:var(--stone); margin-top:4px;">Painted oak, brass furniture</div>
        </div>
        <div style="font-family:var(--font-body); font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:var(--walnut);">2023</div>
      </div>
    </div>
  </div>
</body></html>
