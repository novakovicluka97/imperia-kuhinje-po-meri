<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
  <div class="card-eyebrow">Elevation · one level, used sparingly</div>
  <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:18px; align-items:flex-start;">
    <div>
      <div style="height:96px; background:var(--paper); border:1px solid var(--rule);"></div>
      <div style="font-family:var(--font-display); font-size:16px; margin-top:10px;">elev-0</div>
      <div style="font-family:var(--font-body); font-size:11px; color:var(--stone);">flat — default surface</div>
    </div>
    <div>
      <div style="height:96px; background:var(--paper); box-shadow: 0 1px 0 rgba(26,25,22,0.06), 0 24px 48px -24px rgba(26,25,22,0.20);"></div>
      <div style="font-family:var(--font-display); font-size:16px; margin-top:10px;">elev-1</div>
      <div style="font-family:var(--font-body); font-size:11px; color:var(--stone);">sticky header over image, contact card</div>
    </div>
    <div>
      <div style="height:96px; background:var(--paper); box-shadow: 0 1px 0 rgba(26,25,22,0.08), 0 40px 80px -32px rgba(26,25,22,0.28);"></div>
      <div style="font-family:var(--font-display); font-size:16px; margin-top:10px;">elev-2</div>
      <div style="font-family:var(--font-body); font-size:11px; color:var(--stone);">modals, overlays</div>
    </div>
  </div>
</body></html>
