<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
  <div class="card-eyebrow">Radii & rules</div>
  <div style="display:grid; grid-template-columns: repeat(4, 1fr); gap:18px;">
    <div>
      <div style="height:72px; border:1px solid var(--ink); border-radius:0;"></div>
      <div style="font-family:var(--font-display); font-size:16px; margin-top:8px;">r-0 · 0px</div>
      <div style="font-family:var(--font-body); font-size:11px; color:var(--stone);">default (cards, tiles)</div>
    </div>
    <div>
      <div style="height:72px; border:1px solid var(--ink); border-radius:2px;"></div>
      <div style="font-family:var(--font-display); font-size:16px; margin-top:8px;">r-1 · 2px</div>
      <div style="font-family:var(--font-body); font-size:11px; color:var(--stone);">buttons</div>
    </div>
    <div>
      <div style="height:72px; border:1px solid var(--ink); border-radius:4px;"></div>
      <div style="font-family:var(--font-display); font-size:16px; margin-top:8px;">r-2 · 4px</div>
      <div style="font-family:var(--font-body); font-size:11px; color:var(--stone);">inputs, chips</div>
    </div>
    <div>
      <div style="height:72px; border:1px solid var(--ink); border-radius:999px;"></div>
      <div style="font-family:var(--font-display); font-size:16px; margin-top:8px;">round</div>
      <div style="font-family:var(--font-body); font-size:11px; color:var(--stone);">avatar only</div>
    </div>
  </div>
</body></html>
