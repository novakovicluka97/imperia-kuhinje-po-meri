<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
  <div class="card-eyebrow">Material swatches · finish library</div>
  <div style="display:grid; grid-template-columns: repeat(5, 1fr); gap:14px;">
    <div>
      <div style="aspect-ratio: 1; background:
        linear-gradient(110deg, #6b4a2b 0%, #8a6a4a 40%, #5a3a20 70%, #6b4a2b 100%);
        background-size: 200% 100%;"></div>
      <div style="font-family:var(--font-display); font-size:14px; margin-top:8px;">Walnut, oiled</div>
    </div>
    <div>
      <div style="aspect-ratio: 1; background:
        linear-gradient(110deg, #c9a578 0%, #d8b88a 40%, #b8946a 70%, #c9a578 100%);"></div>
      <div style="font-family:var(--font-display); font-size:14px; margin-top:8px;">European oak</div>
    </div>
    <div>
      <div style="aspect-ratio: 1; background:#2C2A26;"></div>
      <div style="font-family:var(--font-display); font-size:14px; margin-top:8px;">Carbon paint</div>
    </div>
    <div>
      <div style="aspect-ratio: 1; background:#E0D7C7;"></div>
      <div style="font-family:var(--font-display); font-size:14px; margin-top:8px;">Bone paint</div>
    </div>
    <div>
      <div style="aspect-ratio: 1; background:
        radial-gradient(circle at 30% 30%, #c9a878 0%, #a48758 50%, #7d6638 100%);"></div>
      <div style="font-family:var(--font-display); font-size:14px; margin-top:8px;">Aged brass</div>
    </div>
  </div>
</body></html>
