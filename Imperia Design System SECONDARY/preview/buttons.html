<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
  <div class="card-eyebrow">Buttons</div>
  <div style="display:flex; gap:14px; flex-wrap:wrap; align-items:center;">
    <button style="font-family:var(--font-body); font-size:13px; font-weight:500; letter-spacing:0.04em; padding:14px 28px; background:var(--ink); color:var(--bone); border:none; border-radius:2px; cursor:pointer;">Request a consultation</button>
    <button style="font-family:var(--font-body); font-size:13px; font-weight:500; letter-spacing:0.04em; padding:13px 27px; background:transparent; color:var(--ink); border:1px solid var(--ink); border-radius:2px; cursor:pointer;">View the collection</button>
    <button style="font-family:var(--font-body); font-size:13px; font-weight:500; letter-spacing:0.04em; padding:14px 0; background:transparent; color:var(--ink); border:none; border-bottom:1px solid var(--walnut); cursor:pointer;">Read the journal &nbsp;⟶</button>
  </div>
  <div style="display:flex; gap:14px; margin-top:18px; align-items:center;">
    <button style="font-family:var(--font-body); font-size:13px; font-weight:500; letter-spacing:0.04em; padding:14px 28px; background:var(--walnut); color:var(--bone); border:none; border-radius:2px; cursor:pointer;">Primary · hover state</button>
    <button style="font-family:var(--font-body); font-size:13px; font-weight:500; letter-spacing:0.04em; padding:14px 28px; background:var(--ink-50); color:var(--bone); border:none; border-radius:2px; cursor:not-allowed; opacity:0.7;">Disabled</button>
    <span style="font-family:var(--font-body); font-size:11px; color:var(--stone);">All buttons share one size; no large/small variants.</span>
  </div>
</body></html>
