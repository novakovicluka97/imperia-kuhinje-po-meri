<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
  <div class="card-eyebrow">Core palette</div>
  <div style="display:grid; grid-template-columns: repeat(6, 1fr); gap:14px;">
    <div>
      <div style="height:96px; background:#1A1916; border:1px solid var(--rule);"></div>
      <div style="margin-top:8px; font-family:var(--font-display); font-size:16px;">Ink</div>
      <div style="font-family:var(--font-body); font-size:11px; color:var(--stone);">#1A1916</div>
    </div>
    <div>
      <div style="height:96px; background:#F4EFE7; border:1px solid var(--rule);"></div>
      <div style="margin-top:8px; font-family:var(--font-display); font-size:16px;">Bone</div>
      <div style="font-family:var(--font-body); font-size:11px; color:var(--stone);">#F4EFE7</div>
    </div>
    <div>
      <div style="height:96px; background:#6B4A2B; border:1px solid var(--rule);"></div>
      <div style="margin-top:8px; font-family:var(--font-display); font-size:16px;">Walnut</div>
      <div style="font-family:var(--font-body); font-size:11px; color:var(--stone);">#6B4A2B</div>
    </div>
    <div>
      <div style="height:96px; background:#A48758; border:1px solid var(--rule);"></div>
      <div style="margin-top:8px; font-family:var(--font-display); font-size:16px;">Brass</div>
      <div style="font-family:var(--font-body); font-size:11px; color:var(--stone);">#A48758</div>
    </div>
    <div>
      <div style="height:96px; background:#8B847A; border:1px solid var(--rule);"></div>
      <div style="margin-top:8px; font-family:var(--font-display); font-size:16px;">Stone</div>
      <div style="font-family:var(--font-body); font-size:11px; color:var(--stone);">#8B847A</div>
    </div>
    <div>
      <div style="height:96px; background:#5A6650; border:1px solid var(--rule);"></div>
      <div style="margin-top:8px; font-family:var(--font-display); font-size:16px;">Sage</div>
      <div style="font-family:var(--font-body); font-size:11px; color:var(--stone);">#5A6650</div>
    </div>
  </div>
</body></html>
