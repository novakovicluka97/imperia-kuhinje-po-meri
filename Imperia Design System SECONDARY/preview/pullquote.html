<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
  <div class="card-eyebrow">Pull quote · journal style</div>

    <span style="display:inline-block; width:24px; height:1px; background:var(--walnut);"></span>
    <span style="font-family:var(--font-body); font-size:11px; font-weight:500; letter-spacing:0.18em; text-transform:uppercase; color:var(--ink-70);">Marko Babić · Workshop director</span>
  </div>
