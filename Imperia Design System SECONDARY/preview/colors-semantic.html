<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
  <div class="card-eyebrow">Semantic tokens</div>
  <div style="display:grid; grid-template-columns: 1fr 1fr; gap:14px;">
    <div style="background:var(--bone); padding:18px; border:1px solid var(--rule);">
      <div style="font-family:var(--font-display); font-size:22px; color:var(--ink); line-height:1.1;">fg1 on bg</div>
      <div style="font-family:var(--font-body); font-size:13px; color:var(--ink-70); margin-top:6px;">fg2 — secondary text</div>
      <div style="font-family:var(--font-body); font-size:12px; color:var(--stone); margin-top:4px;">fg3 — meta / caption</div>
      <div style="font-family:var(--font-body); font-size:11px; font-weight:500; letter-spacing:0.18em; text-transform:uppercase; color:var(--walnut); margin-top:10px;">accent</div>
    </div>
    <div style="background:var(--ink); padding:18px; border:1px solid var(--ink);">
      <div style="font-family:var(--font-display); font-size:22px; color:var(--bone); line-height:1.1;">fg-inverse on bg-inverse</div>
      <div style="font-family:var(--font-body); font-size:13px; color:#C9C2B4; margin-top:6px;">muted bone</div>
      <div style="font-family:var(--font-body); font-size:12px; color:#8B847A; margin-top:4px;">stone — meta</div>
      <div style="font-family:var(--font-body); font-size:11px; font-weight:500; letter-spacing:0.18em; text-transform:uppercase; color:#A48758; margin-top:10px;">brass accent</div>
    </div>
  </div>
</body></html>
