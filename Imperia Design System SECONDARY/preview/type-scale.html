<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
  <div class="card-eyebrow">Type scale · Cormorant Garamond 500 + italic 400</div>
  <div style="display:flex; flex-direction:column; gap:14px;">
    <div style="display:flex; align-items:baseline; gap:24px;">
      <span style="font-family:var(--font-body); font-size:11px; color:var(--stone); width:56px;">H1 · 64</span>
      <span style="font-family:var(--font-display); font-weight:500; font-size:64px; line-height:1; letter-spacing:-0.01em;">Drawn full-size</span>
    </div>
    <div style="display:flex; align-items:baseline; gap:24px;">
      <span style="font-family:var(--font-body); font-size:11px; color:var(--stone); width:56px;">H2 · 44</span>
      <span style="font-family:var(--font-display); font-weight:500; font-size:44px; line-height:1.05; letter-spacing:-0.01em;">The Workshop</span>
    </div>
    <div style="display:flex; align-items:baseline; gap:24px;">
      <span style="font-family:var(--font-body); font-size:11px; color:var(--stone); width:56px;">H3 · 28</span>
      <span style="font-family:var(--font-display); font-weight:500; font-size:28px; line-height:1.15;">Solid oak, hand-finished</span>
    </div>
    <div style="display:flex; align-items:baseline; gap:24px;">
      <span style="font-family:var(--font-body); font-size:11px; color:var(--stone); width:56px;">Lead · 22 it.</span>
      <span style="font-family:var(--font-display); font-style:italic; font-weight:400; font-size:22px; line-height:1.4; color:var(--ink-70);">A quiet measure of the room</span>
    </div>
  </div>
</body></html>
